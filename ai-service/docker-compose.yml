services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-ai-service
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      PORT: 8000
      ENVIRONMENT: production
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-finance_controller_internal_secret_key_2026}
      DB_HOST: ${DB_HOST:-finance-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-finance_controller}
      DB_USER: ${DB_USER:-finance_ai_user}
      DB_PASSWORD: ${DB_PASSWORD:-ai_secure_password}
      REDIS_HOST: ${REDIS_HOST:-finance-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_password}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://finance_admin:rabbitmq_secure_password@finance-rabbitmq:5672}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-models/text-embedding-004}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/internal/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - finance-network

networks:
  finance-network:
    external: true
