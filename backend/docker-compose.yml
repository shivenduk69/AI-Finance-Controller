services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: ${DB_HOST:-finance-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-finance_controller}
      DB_USER: ${DB_USER:-finance_backend_user}
      DB_PASSWORD: ${DB_PASSWORD:-backend_secure_password}
      REDIS_HOST: ${REDIS_HOST:-finance-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_password}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://finance_admin:rabbitmq_secure_password@finance-rabbitmq:5672}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://finance-ai-service:8000}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-finance_controller_internal_secret_key_2026}
      JWT_SECRET: ${JWT_SECRET:-finance_controller_jwt_super_secret_key_production_grade_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - finance-network

networks:
  finance-network:
    external: true
